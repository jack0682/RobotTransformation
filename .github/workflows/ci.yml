name: CI

on:
  push:
    branches: [main, develop, 'codex/**', 'feature/**', 'fix/**', 'docs/**', 'chore/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  GIT_OPTIONAL_LOCKS: '0'
  GIT_NO_REPLACE_OBJECTS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repository:
    name: Root governance and import-stage fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Retain G0 governance and add M2 refusal cases
        run: |
          python3 -B .github/test_governance.py
          python3 -B .github/test_import.py
      - name: Validate declared root and imported file inventory
        run: python3 -B tools/governance/check_repository.py
      - name: Validate PR route
        if: github.event_name == 'pull_request'
        run: python3 -B tools/governance/check_repository.py --event "$GITHUB_EVENT_PATH"

  commit_policy:
    name: Full-head author DCO and OpenPGP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Audit every ancestor of the contribution head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B tools/governance/check_commit_policy.py --head "$HEAD_SHA" --github-repository "$GITHUB_REPOSITORY"

  import_fidelity:
    name: Frozen source bytes, modes, Git objects and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check worktree, index and exact candidate source closure
        run: python3 -B tools/migration/check_import.py --git

  sdk_parity:
    name: Same-candidate SDK producer parity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check SDK self inventory and producer export
        run: python3 -B rx-platform/tools/check_host_sdk.py rx-solutions/sdk

  static_identity:
    name: Frozen source identity recipes and binding closure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compare named static identities against the pinned baseline
        run: python3 -B tools/migration/source_identities.py compare --baseline-report provenance/import/M2-source-identities.json --target . --output "$RUNNER_TEMP/m2-source-identities.json"

  ci:
    name: ${{ github.event_name == 'pull_request' && 'CI' || 'Branch CI' }}
    if: ${{ always() }}
    needs: [repository, commit_policy, import_fidelity, sdk_parity, static_identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require every SOURCE_IMPORTED_UNVALIDATED stage check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -B tools/governance/check_ci.py
