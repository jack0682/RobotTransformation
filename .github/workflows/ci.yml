name: CI

on:
  push:
    branches: [main, develop, 'codex/**', 'feature/**', 'fix/**', 'docs/**', 'chore/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash
    working-directory: source

env:
  GIT_OPTIONAL_LOCKS: '0'
  GIT_NO_REPLACE_OBJECTS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  RX_CI_DECLARATION: CI_SCOPE_DECLARED_NOT_YET_RUN
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  repository:
    name: Root governance and stage regression fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Run retained and current governance fixtures
        run: |
          python3 -B .github/test_governance.py
          python3 -B .github/test_import.py
          python3 -B .github/test_full_ci.py
          python3 -B .github/test_root_signing.py
          python3 -B tools/governance/test_legacy_admin_guards.py
          python3 -B tools/governance/check_repository.py
      - name: Validate PR route
        if: github.event_name == 'pull_request'
        run: |
          python3 -B tools/governance/check_repository.py --event "$GITHUB_EVENT_PATH"

  commit_policy:
    name: Full-head author DCO and OpenPGP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Audit the exact contribution head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B tools/governance/check_commit_policy.py --head "$HEAD_SHA" --github-repository "$GITHUB_REPOSITORY"

  import_fidelity:
    name: Immutable M2 ancestor and proof objects
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Audit original import without freezing current product files
        run: |
          python3 -B tools/migration/check_origin.py

  sdk_parity:
    name: Same-candidate SDK producer parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Check self inventory and fresh export
        run: |
          python3 -B rx-platform/tools/check_host_sdk.py rx-solutions/sdk

  static_identity:
    name: Named identities and reviewed source context
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Compare original identities and the exact reviewed source context
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B tools/verification/run_compiled_identities.py --repo . --expected-head "$CANDIDATE_SHA" --work "$RUNNER_TEMP/m3-static-identities" --baseline provenance/import/M2-source-identities.json --evaluator tools/migration/source_identities.py --reviewed-context provenance/verification/m1-admission-context-review.json --static-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: static-source-identities
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/m3-static-identities/*.json
            ${{ runner.temp }}/m3-static-identities/logs/**

  platform_repository:
    name: Platform repository and contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/rx-platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Run original repository and real Git-GPG fixtures
        run: |
          python3 -B .github/test_repository.py
          python3 -B .github/test_commit_policy.py
      - name: Run content and semantic integrity gates
        run: |
          python3 -B tools/check_repository.py
          python3 -B tools/check_invariant_traceability.py
          python3 -B tools/check_engine_boundaries.py
          python3 -B tools/check_contract_baselines.py
          python3 -B tools/test_export_host_sdk.py
          for checker in tools/update_*_binding.py; do
            python3 -B "$checker" --check
          done

  solutions_repository:
    name: Solutions repository and boundary checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/rx-solutions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Run original repository and real Git-GPG fixtures
        run: |
          python3 -B .github/test_repository.py
          python3 -B .github/test_commit_policy.py
      - name: Run request recovery and installer boundaries
        run: |
          python3 -B tools/test_runtime_skill_client.py
          python3 -B tools/test_definition_client.py
          python3 -B tools/test_workflow_client.py
          python3 -B tools/test_execution_client.py
          python3 -B tools/test_api_transport.py
          python3 -B tools/test_linux_dev_bundle.py
          python3 -B tools/test_python_environment.py
          python3 -B tools/test_python_host_runner.py
          python3 -B tools/test_external_adapter.py
          python3 -B tools/test_material_alignment.py
          python3 -B apps/operator/tests/test_with_servers.py
      - name: Run content invariant and native provenance gates
        run: |
          python3 -B tools/check_repository.py
          python3 -B tools/check_invariant_traceability.py
          python3 -B tools/check_device_catalog_sources.py
          python3 -B tools/test_native_inventory.py

  document_integrity:
    name: Canonical documents and historical origin integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check JSON normative hashes links and embedded tables
        run: |
          python3 -B .github/test_documents.py
          python3 -B .github/test_canonical_layout.py
          python3 -B .github/test_canonical_root.py
          python3 -B tools/docs/check_documents.py --run-tables

  platform_rust:
    name: rx-platform full Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source/rx-platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/rx-platform-target
          key: ${{ runner.os }}-${{ runner.arch }}-rx-platform-${{ hashFiles('source/rx-platform/Cargo.lock', 'source/rx-platform/rust-toolchain.toml', 'source/rx-solutions/sdk/source-lock.json') }}
      - name: Format lint and test the complete original workspace
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rx-platform-target
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked


  solutions_rust:
    name: rx-solutions full Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source/rx-solutions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/rx-solutions-target
          key: ${{ runner.os }}-${{ runner.arch }}-rx-solutions-${{ hashFiles('source/rx-solutions/Cargo.lock', 'source/rx-solutions/rust-toolchain.toml', 'source/rx-solutions/sdk/source-lock.json') }}
      - name: Format lint and test the complete original workspace
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rx-solutions-target
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked --no-fail-fast

  clients:
    name: Installed Python and C++ clients
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/rx-platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Install pinned client build dependencies
        run: |
          # Keep Ubuntu suites and signing keys; use the reachable official archive.
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc nlohmann-json3-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/rx-client-env"
          "$RUNNER_TEMP/rx-client-env/bin/pip" install grpcio==1.84.0 protobuf==7.36.2 setuptools==84.0.0 wheel==0.48.0 build==1.6.1
      - name: Reject incomplete bundles and install both client consumers
        run: |
          python3 -B tools/test_prepare_clients.py
          "$RUNNER_TEMP/rx-client-env/bin/python" -B tools/test_client_packages.py --work "$RUNNER_TEMP/rx-client-check"

  operator:
    name: Operator application (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [normal, changed-material, groove-missing, completion-loss, lost-start-response]
    defaults:
      run:
        working-directory: source/rx-solutions/apps/operator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/rx-solutions/apps/operator/package-lock.json
      - name: Run all original operator checks
        id: operator_checks
        run: |
          npm ci
          npm run format:check
          npm test
          npm run test:bundle
          npm run build
      - name: Prepare the isolated Linux browser environment
        run: |
          # Keep Ubuntu suites and signing keys; use the reachable official archive.
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          mkdir -p "$RUNNER_TEMP/operator-browser"
          uname -a > "$RUNNER_TEMP/operator-browser/environment.txt"
          lscpu >> "$RUNNER_TEMP/operator-browser/environment.txt"
          free -b >> "$RUNNER_TEMP/operator-browser/environment.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/operator-browser/environment.txt"
          printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" >> "$RUNNER_TEMP/operator-browser/environment.txt"
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("../../../rx-platform/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          python3 -m venv "$RUNNER_TEMP/operator-browser-env"
          "$RUNNER_TEMP/operator-browser-env/bin/pip" install -r tests/requirements-browser.txt
          "$RUNNER_TEMP/operator-browser-env/bin/pip" install cryptography==50.0.2
          "$RUNNER_TEMP/operator-browser-env/bin/python" -m playwright install --with-deps chromium
      - name: Build the device-free M1 integration candidate
        id: m1_build
        working-directory: source
        run: |
          docker build -f rx-platform/tools/draft_m1/Simulation.Dockerfile --build-context btcpp=https://github.com/BehaviorTree/BehaviorTree.CPP.git#6e469c6ba133aaa842dac9b096b41f2d33ee2b0e -t rx-draft-m1:current .
      - name: Verify real M1 browser runtime and negative cases
        working-directory: source
        run: |
          "$RUNNER_TEMP/operator-browser-env/bin/python" -B rx-platform/tools/draft_m1/run.py --platform-image rx-draft-m1:current --solutions-image rx-draft-m1:current --workspace "$RUNNER_TEMP/m1-private-${{ matrix.scenario }}" --evidence-dir "$RUNNER_TEMP/m1-evidence/${{ matrix.scenario }}" --case "${{ matrix.scenario }}"
      - name: Verify browser authoring against the actual Platform API
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/operator-platform-target
        run: |
          (cd ../../../rx-platform && cargo build -p rx-api --bin rx-platform-local --locked)
          "$RUNNER_TEMP/operator-browser-env/bin/python" tests/run_browser.py --platform-executable "$CARGO_TARGET_DIR/debug/rx-platform-local" --evidence-dir "$RUNNER_TEMP/operator-browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: draft-m1-public-evidence-${{ matrix.scenario }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/m1-evidence/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operator-browser-${{ matrix.scenario }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/operator-browser/**

  dynamixel:
    name: Pinned DYNAMIXEL helper boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/rx-solutions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Build protocol-only helper and exercise direct-caller refusals
        run: |
          # Keep Ubuntu suites and signing keys; use the reachable official archive.
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nlohmann-json3-dev
          cmake -S native/dynamixel -B "$RUNNER_TEMP/rx-dynamixel-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/rx-dynamixel-build" -j2
          python3 -B tools/test_dynamixel_helper.py --helper "$RUNNER_TEMP/rx-dynamixel-build/rx-dynamixel-ping"

  skills:
    name: Installed skills same candidate P (${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source/rx-solutions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Build and exercise installed local-simulation release
        run: |
          python3 -B tools/test_skill_image_identity.py
          python3 -B tools/build_skill_release.py --platform "$GITHUB_WORKSPACE/source/rx-platform" --architecture '${{ matrix.arch }}' --build-jobs 2 --cache-namespace 'candidate-${{ matrix.arch }}' --output "$RUNNER_TEMP/skill-bundle"
          python3 -B tools/test_skill_install.py --bundle "$RUNNER_TEMP/skill-bundle/bundle" --evidence "$RUNNER_TEMP/skill-acceptance"
          cp "$RUNNER_TEMP/skill-acceptance/result.json" "$RUNNER_TEMP/skill-bundle/acceptance-${{ matrix.arch }}.json"
          cp "$RUNNER_TEMP/skill-bundle/bundle/release.json" "$RUNNER_TEMP/skill-bundle/release-${{ matrix.arch }}.json"
          cp deployment/local-skills/install.sh "$RUNNER_TEMP/skill-bundle/install.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skills-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/skill-bundle/*.tar.gz
            ${{ runner.temp }}/skill-bundle/*.sha256
            ${{ runner.temp }}/skill-bundle/*.json
            ${{ runner.temp }}/skill-bundle/install.sh

  skills_compatibility:
    name: Installed skills old pinned P (${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source/rx-solutions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jack0682/rx-platform
          ref: e08fd1a45e2782d10f222d00ef1962a675463609
          path: compat-platform
          persist-credentials: false
      - name: Verify the original compatibility source pin
        run: |
          python3 -c 'import json; v=json.load(open("deployment/local-skills/platform-source.json")); assert v["repository"] == "jack0682/rx-platform" and v["commit"] == "e08fd1a45e2782d10f222d00ef1962a675463609"'
      - name: Build and exercise installed local-simulation release
        run: |
          python3 -B tools/test_skill_image_identity.py
          python3 -B tools/build_skill_release.py --platform "$GITHUB_WORKSPACE/compat-platform" --architecture '${{ matrix.arch }}' --build-jobs 2 --cache-namespace 'compat-${{ matrix.arch }}' --output "$RUNNER_TEMP/skill-bundle"
          python3 -B tools/test_skill_install.py --bundle "$RUNNER_TEMP/skill-bundle/bundle" --evidence "$RUNNER_TEMP/skill-acceptance"
          cp "$RUNNER_TEMP/skill-acceptance/result.json" "$RUNNER_TEMP/skill-bundle/acceptance-${{ matrix.arch }}.json"
          cp "$RUNNER_TEMP/skill-bundle/bundle/release.json" "$RUNNER_TEMP/skill-bundle/release-${{ matrix.arch }}.json"
          cp deployment/local-skills/install.sh "$RUNNER_TEMP/skill-bundle/install.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skills_compatibility-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/skill-bundle/*.tar.gz
            ${{ runner.temp }}/skill-bundle/*.sha256
            ${{ runner.temp }}/skill-bundle/*.json
            ${{ runner.temp }}/skill-bundle/install.sh

  compiled_identity:
    name: Actual public identity observations in isolated source copies
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rx-platform/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
      - name: Build existing packages and compare public identity calls
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B tools/verification/run_compiled_identities.py --repo . --expected-head "$CANDIDATE_SHA" --work "$RUNNER_TEMP/m3-identities" --baseline provenance/import/M2-source-identities.json --evaluator tools/migration/source_identities.py --reviewed-context provenance/verification/m1-admission-context-review.json --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiled-source-identities
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/m3-identities/*.json
            ${{ runner.temp }}/m3-identities/logs/**

  ci:
    name: ${{ github.event_name == 'pull_request' && 'CI' || 'Branch CI' }}
    if: ${{ always() }}
    needs: [repository, commit_policy, import_fidelity, sdk_parity, static_identity, platform_repository, solutions_repository, document_integrity, platform_rust, solutions_rust, clients, operator, dynamixel, skills, skills_compatibility, compiled_identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Require every declared M3 validation job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -B tools/governance/check_ci.py
